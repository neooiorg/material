<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>Ngoại tuyến | Material</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f8fafc;color:#18181b;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}.card{width:min(100%,420px);border:1px solid #e4e4e7;border-radius:16px;background:#fff;padding:36px;box-shadow:0 20px 55px -36px rgba(15,23,42,.45)}img{display:block;width:48px;height:48px;margin-bottom:28px}h1{margin:0;font-size:28px;letter-spacing:-.025em}p{margin:12px 0 24px;color:#52525b;line-height:1.6}button{min-height:44px;width:100%;border:0;border-radius:11px;background:#18181b;color:white;font:inherit;font-weight:600;padding:11px 18px;cursor:pointer}button:focus-visible{outline:3px solid #a5b4fc;outline-offset:3px}
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/app-icon.svg" alt="">
      <h1>Chưa có kết nối mạng</h1>
      <p>Material cần kết nối để tải dữ liệu vật tư mới nhất. Kiểm tra Wi-Fi hoặc dữ liệu di động rồi thử lại.</p>
      <button type="button" onclick="location.reload()">Thử kết nối lại</button>
    </main>
  </body>
</html>
